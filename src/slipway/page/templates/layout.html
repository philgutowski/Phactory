<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="$refresh">
<title>$title</title>
<style>
  :root { color-scheme: light dark; --fg: #1d1f23; --muted: #5d6370; --line: #d9dce1;
          --bg: #ffffff; --card: #f6f7f9; --alert: #a3361c; --link: #1f5fbf; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e6e8eb; --muted: #a1a7b1; --line: #343841; --bg: #15171a;
            --card: #1e2125; --alert: #f08a6c; --link: #7fb0ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  h2 { font-size: 1.15rem; margin: 28px 0 4px; }
  h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em;
       color: var(--muted); margin: 20px 0 6px; }
  .n { font-variant-numeric: tabular-nums; }
  .sentence { font-size: 1.05rem; margin: 4px 0 8px; }
  nav { font-size: 0.9rem; margin-bottom: 12px; }
  a { color: var(--link); }
  ul.rows { list-style: none; margin: 0; padding: 0; }
  ul.rows li { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
               padding: 10px 12px; margin: 0 0 8px; overflow-wrap: anywhere; }
  ul.rows li.needs { border-left: 4px solid var(--alert); }
  ul.rows li.empty { background: none; border-style: dashed; color: var(--muted); }
  .key { font-weight: 600; }
  .state, .age, .meta { color: var(--muted); font-size: 0.9rem; }
  .why, .what { margin: 4px 0 0; }
  .what { font-weight: 600; }
  .scores { margin: 4px 0 0; font-size: 0.9rem; }
  .excerpt { margin: 4px 0 0; font: 0.85rem/1.4 ui-monospace, monospace; white-space: pre-wrap; }
  footer { color: var(--muted); font-size: 0.8rem; margin-top: 28px; }
</style>
</head>
<body>
<main>
$body
<footer>Read only. Every approval is made on the host. Refreshes every $refresh seconds.</footer>
</main>
</body>
</html>
