[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "phactory"
version = "0.0.0"
description = "The landing and grading authority between coding agent builders and a customer's repository."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src holds the package, tests holds the guard and helper modules.
pythonpath = ["src", "tests"]
# Plugins named with -p load before any conftest or test module, so the
# network guard is in place before anything under test can open a socket.
# _gate turns a skipped integration test into a failure when CI is set.
addopts = "-p _nonet -p _gate -p pytester"
markers = [
    "integration: needs the local Postgres named by PHACTORY_TEST_DSN",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
