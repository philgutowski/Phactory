[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "slipway"
version = "0.0.0"
description = "The landing and grading authority between coding agent builders and a customer's repository."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # The Postgres driver for the records store (U7). The binary extra ships libpq.
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The migration files ship inside the package beside migrate.py.
slipway = ["records/schema/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src holds the package, tests holds the guard and helper modules, and the
# repository root holds factory, the tooling Slipway builds itself with.
pythonpath = ["src", "tests", "."]
# Plugins named with -p load before any conftest or test module, so the
# network guard is in place before anything under test can open a socket.
# _gate turns a skipped integration test into a failure when CI is set.
addopts = "-p _nonet -p _gate -p pytester"
markers = [
    "integration: needs the local Postgres named by SLIPWAY_TEST_DSN",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
