# Slipway's own gate (KTD19). Written inside the runner's v0 subset: one
# checkout step and one run step, so the same file works on GitHub hosted
# runners now and on a zig-actions-runner instance once the repository
# variable SLIPWAY_RUNS_ON names that instance's label.
#
# The job is named ci because that name is the required status check.
# There is no merge_group trigger: this repository has no merge queue (U2).

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ${{ vars.SLIPWAY_RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Python, local Postgres, ruff, pytest
        run: |
          set -euxo pipefail

          # Python 3.12 and Postgres from the distribution. Both are already on
          # the hosted image; installing makes the step work on a bare runner too.
          sudo apt-get update -q
          sudo apt-get install -y -q python3.12 python3.12-venv postgresql

          # A throwaway Postgres owned by the runner user, on a port no system
          # service uses, with trust auth on loopback only. Started here rather
          # than as a service container because the runner subset has none.
          PG_BIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n 1)
          PG_DIR="$RUNNER_TEMP/pg"
          "$PG_BIN/initdb" -D "$PG_DIR/data" -A trust -U slipway > /dev/null
          "$PG_BIN/pg_ctl" -D "$PG_DIR/data" -l "$PG_DIR/log" -w \
            -o "-k $PG_DIR -p 54329 -c listen_addresses=127.0.0.1" start
          "$PG_BIN/createdb" -h 127.0.0.1 -p 54329 -U slipway slipway_test
          export SLIPWAY_TEST_DSN="postgresql://slipway@127.0.0.1:54329/slipway_test"

          python3.12 -m venv .venv
          . .venv/bin/activate
          python -m pip install -q -e '.[dev]'

          ruff check .
          # CI is set by the runner, so _gate fails any skipped integration test.
          # The import graph test (tests/test_imports.py) runs inside this suite.
          python -m pytest -q
